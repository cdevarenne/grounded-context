# Curated reading list for the semantic path. Hand-picked, NOT a crawl.
#
# Only this manifest is committed. The fetched text lands in corpus/raw/, which is
# gitignored — third-party documentation prose is never committed to this repo. See the
# "two bodies of content" section of the README for why this corpus is governed differently
# from knowledge/.
#
# Fetch with:  uv run python scripts/fetch_corpus.py

sources:
  # --- Elastic: the semantic path's own subject matter -------------------------------
