[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-context"
version = "0.1.0"
description = "A grounded, composable, deterministic-where-it-matters context layer for enterprise agents."
requires-python = ">=3.14"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = [
    "mcp>=2.0.0",
]
es = [
    "elasticsearch>=9.5.0",
]

[project.scripts]
# `gc` is taken by graphviz on Homebrew — don't reuse it.
gctx = "grounded_context.cli:main"
grounded-context = "grounded_context.cli:main"
# Needs the `mcp` extra installed; the deterministic CLI above does not.
gctx-mcp = "grounded_context.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
